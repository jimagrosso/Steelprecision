<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Propuesta víveres Wisconsin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE work pitch, confident and fresh
   IDEA the order-tracking screen of a grocery app: a timer that is running
   PICTURE phone mock-up with the live 17-min ring and a real basket
   COLOUR white ground, produce green #0b6b3a dominant, tomato #e5432d accent
   TYPE Archivo 800 display + Inter text
   LAYOUT laptop: title + figures left, phone right on a green field; phone: title, phone, cards */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1511);--ink:light-dark(#121a15,#eef3ef);--mut:light-dark(#4d5a52,#a9b7ae);--g:light-dark(#0b6b3a,#2fa766);--gf:light-dark(#e6f3eb,#14241a);--t:#e5432d;--line:light-dark(#dfe7e2,#24332a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;letter-spacing:-.02em;line-height:1.05;text-wrap:balance;margin:0}
h1{font-weight:800;font-size:clamp(32px,4.6vw,52px)}
h2{font-weight:800;font-size:clamp(24px,3vw,32px);margin-bottom:20px}
h3{font-weight:800;font-size:20px;margin-bottom:8px}
.band{padding-block:clamp(28px,4vw,56px);padding-inline:max(5vw,16px)}
.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:10px max(5vw,16px);font-size:14px}
.bar b{font-variant-numeric:tabular-nums;color:#ffb3a7;white-space:nowrap}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(24px,4vw,64px);align-items:center;background:var(--gf)}
.brand{color:var(--g);font-weight:600;margin:0 0 14px}
.lead{font-size:17px;color:var(--mut);max-width:34em;margin:16px 0 24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(8em,1fr));gap:12px}
.kpis div{border-top:3px solid var(--g);padding-top:10px}
.kpis b{display:block;font:800 clamp(28px,3.4vw,40px)/1 Archivo,sans-serif;color:var(--g)}
.kpis span{font-size:14px;color:var(--mut)}
.phone{justify-self:center;width:min(300px,100%);aspect-ratio:9/18.5;background:#101512;border-radius:42px;padding:11px;box-shadow:0 24px 50px -24px rgba(11,60,30,.55)}
.screen{height:100%;background:#fff;color:#121a15;border-radius:32px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.status{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.apphead{display:flex;justify-content:space-between;align-items:baseline}
.apphead b{font:800 20px Archivo,sans-serif;color:#0b6b3a}.apphead span{font-size:13px;color:#4d5a52}
.ring{position:relative;width:62%;margin:4px auto 0;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:#e6f3eb;stroke-width:11}
.arc{fill:none;stroke:#0b6b3a;stroke-width:11;stroke-linecap:round;stroke-dasharray:314;stroke-dashoffset:96;animation:tick 6s ease-in-out infinite alternate}
@keyframes tick{to{stroke-dashoffset:120}}
@media(prefers-reduced-motion:reduce){.arc{animation:none}}
.rtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rtxt b{font:800 44px/1 Archivo,sans-serif}.rtxt span{font-size:13px;color:#4d5a52}
.onway{text-align:center;font-weight:600;margin:0;font-size:15px}
.items{list-style:none;margin:0;padding:0;font-size:13px}
.items li,.total{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #e6ece8}
.items b,.total b{white-space:nowrap;font-variant-numeric:tabular-nums}
.total{border:0;font-weight:600;font-size:14px}
.btn{margin-top:auto;background:#e5432d;color:#fff;text-align:center;border-radius:14px;padding:12px;font-weight:600;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:16px;padding:22px}
.card.a{background:var(--gf)}
.card p{margin:0 0 12px;color:var(--mut)}
.card ul{margin:0;padding-left:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid4 div{border-top:1px solid var(--line);padding-top:12px}
.grid4 b{display:block;font-size:17px}.grid4 span{color:var(--mut);font-size:15px}
.road{background:var(--gf)}
.line{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative}
.line li{position:relative;padding-top:26px}
.line li::before{content:"";position:absolute;top:6px;left:0;width:14px;height:14px;border-radius:50%;background:var(--g)}
.line li::after{content:"";position:absolute;top:12px;left:14px;right:0;height:2px;background:var(--g);opacity:.35}
.line li:last-child::before{background:var(--t)}.line li:last-child::after{display:none}
.line b{display:block;font:800 18px Archivo,sans-serif;white-space:nowrap}.line span{color:var(--mut);font-size:15px}
.close{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;background:var(--g);color:#fff}
.close h2{margin-bottom:8px}.close p{margin:0;max-width:34em}
.sign{font-size:13px;opacity:.8}
.wm{position:fixed;inset:-50%;z-index:4;pointer-events:none;display:flex;flex-wrap:wrap;align-content:flex-start;gap:70px 90px;transform:rotate(-24deg);opacity:.07;font:600 15px Inter,sans-serif;color:var(--ink)}
.shield{position:fixed;inset:0;z-index:9;background:var(--bg);display:none;place-content:center;text-align:center;padding:24px}
.shield.on{display:grid}
.dead{min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px;gap:10px}
.dead h1{font-size:clamp(28px,4vw,40px)}
.dead p{color:var(--mut);margin:0}
@media(max-width:860px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr)}.phone{width:min(270px,82%)}.cards,.line{grid-template-columns:minmax(0,1fr)}.line li{padding:0 0 18px 26px}.line li::before{top:4px}.line li::after{top:18px;bottom:0;left:6px;right:auto;width:2px;height:auto}.bar{font-size:13px}}
@media print{body *{display:none!important}}
</style>
</head>

let start=Date.now();

const end=Math.min(start+DUR,DEADLINE);
const fmt=ms=>{const t=Math.max(0,Math.floor(ms/1000));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};

  const html=new TextDecoder().decode(bytes);
  const stamp=new Date().toLocaleString('es',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const wm=Array.from({length:160},()=>'<span>Confidencial · Inecbit Labs · '+stamp+'</span>').join('');
